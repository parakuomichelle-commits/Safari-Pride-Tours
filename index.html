<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safari Pride Tours</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
/* Hero and layout styles */
body, html {
  margin: 0;
  padding: 0;
  font-family: 'Inter', sans-serif;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  position: sticky;
  top: 0;
  z-index: 10;
}

header .logo {
  height: 50px;
}

header nav a {
  margin-left: 16px;
  text-decoration: none;
  color: #6e6b63;
  font-weight: 500;
}

.hero {
  position: relative;
  height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: white;
  background-image: url('assets/images/safari1.jpg'); /* your hero image */
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.hero::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4); /* dark overlay for text readability */
  z-index: 1;
}

.hero .hero-text {
  position: relative;
  z-index: 2;
  max-width: 600px;
}

.hero h1 {
  font-size: 36px;
  margin-bottom: 12px;
}

.hero p {
  font-size: 18px;
  margin-bottom: 20px;
}

.btn {
  padding: 12px 20px;
  background: #6b5b3b;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-size: 16px;
  margin: 0 8px;
  display: inline-block;
}

.btn:hover {
  background: #2b5f4d;
}
</style>
</head>
<body>

<header>
  <img src="assets/images/logo.png" class="logo" alt="Safari Pride Tours Logo">
  <nav>
    <a href="index.html">Home</a>
    <a href="signup.html">Sign Up</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-text">
    <h1>Discover Africa’s Wild Beauty</h1>
    <p>Embark on unforgettable safari adventures with Safari Pride Tours!</p>
    <a href="signup.html" class="btn">Book Your Tour</a>
    <a href="signup.html" class="btn">Sign Up</a>
    <a href="login.html" class="btn">Login</a>
  </div>
</section>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Safari Pride</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('images/logo.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 380px;
            text-align: center;
        }
        .login-container h2 {
            color: #2e3a2f;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .login-container label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            text-align: left;
        }
        .login-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        .login-container button {
            width: 100%;
            padding: 14px;
            background-color: #6b8e23;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .login-container button:hover {
            background-color: #556b2f;
        }
        .message { text-align: center; margin-bottom: 15px; font-weight: bold; color: red; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login to Safari Pride</h2>
        <form method="POST" action="login.php">
            <label>Email:</label>
            <input type="email" name="email" placeholder="Your email" required>

            <label>Password:</label>
            <input type="password" name="password" placeholder="Enter password" required>

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
